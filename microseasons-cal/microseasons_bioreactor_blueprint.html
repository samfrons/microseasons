<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #001a33;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }
        
        #blueprint {
            background: #003366;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
        }
        
        .blueprint-line {
            stroke: #00d4ff;
            fill: none;
            stroke-width: 1.5;
        }
        
        .blueprint-line-thin {
            stroke: #00d4ff;
            fill: none;
            stroke-width: 0.8;
        }
        
        .blueprint-line-thick {
            stroke: #00d4ff;
            fill: none;
            stroke-width: 2.5;
        }
        
        .blueprint-text {
            fill: #00d4ff;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            letter-spacing: 1px;
        }
        
        .blueprint-text-small {
            fill: #00d4ff;
            font-family: 'Courier New', monospace;
            font-size: 8px;
            letter-spacing: 0.5px;
        }
        
        .blueprint-text-tiny {
            fill: #00d4ff;
            font-family: 'Courier New', monospace;
            font-size: 7px;
            letter-spacing: 0.3px;
        }
        
        .blueprint-text-title {
            fill: #00d4ff;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        
        .dimension-line {
            stroke: #00d4ff;
            fill: none;
            stroke-width: 0.8;
        }
        
        .dimension-arrow {
            fill: #00d4ff;
        }
        
        .grid-background {
            stroke: rgba(0, 212, 255, 0.1);
            fill: none;
            stroke-width: 0.5;
        }
        
        .panel-frame {
            stroke: #00d4ff;
            fill: none;
            stroke-width: 1.2;
        }
        
        .tubing {
            stroke: #00ffaa;
            fill: none;
            stroke-width: 2;
            opacity: 0.8;
        }
        
        .tubing-thin {
            stroke: #00ffaa;
            fill: none;
            stroke-width: 1.2;
            opacity: 0.7;
        }
        
        .algae-culture {
            fill: rgba(0, 255, 170, 0.15);
            stroke: #00ffaa;
            stroke-width: 0.8;
        }
        
        .led-indicator {
            fill: #ffaa00;
            opacity: 0.7;
        }
        
        .flow-arrow {
            fill: #00ffaa;
        }
        
        .connector-node {
            fill: #00d4ff;
        }
        
        .title-block-bg {
            fill: rgba(0, 50, 100, 0.3);
            stroke: #00d4ff;
            stroke-width: 1.5;
        }
        
        .highlight-component {
            stroke: #ffaa00;
            fill: none;
            stroke-width: 2;
            stroke-dasharray: 4, 4;
        }
    </style>
</head>
